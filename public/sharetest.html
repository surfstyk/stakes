<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Stakes · share diagnostic</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body { margin: 0; padding: 16px 16px 40px; background: #17130e; color: #f3ece0;
        font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
      h1 { font-size: 18px; margin: 0 0 4px; }
      .sub { color: #a89c88; font-size: 13px; margin: 0 0 16px; }
      table { width: 100%; border-collapse: collapse; margin-bottom: 16px; font-size: 13.5px; }
      td { padding: 6px 4px; border-bottom: 1px solid #2e2820; vertical-align: top; }
      td:first-child { color: #a89c88; white-space: nowrap; padding-right: 10px; }
      .ok { color: #5ff0a8; font-weight: 700; }
      .no { color: #ff7a5c; font-weight: 700; }
      button { display: block; width: 100%; margin: 8px 0; padding: 15px; border: 0;
        border-radius: 12px; font-size: 16px; font-weight: 700; background: #ef2d06; color: #fff; }
      button.alt { background: #2e2820; color: #f3ece0; }
      img#card { width: 150px; height: auto; border-radius: 10px; display: block; margin: 10px auto 0;
        -webkit-touch-callout: default; }
      .imgnote { text-align: center; font-size: 12px; color: #a89c88; margin-top: 6px; }
      pre#log { background: #0e0b08; border: 1px solid #2e2820; border-radius: 10px; padding: 12px;
        font-size: 12px; line-height: 1.5; white-space: pre-wrap; word-break: break-word;
        max-height: 40vh; overflow: auto; margin: 4px 0 12px; }
      .sec { font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: #a89c88;
        margin: 18px 0 6px; }
    </style>
  </head>
  <body>
    <h1>Stakes · share diagnostic</h1>
    <p class="sub">Open this INSIDE Nimiq Pay. Tap each button top-to-bottom, then “Copy the log” and send it over.</p>

    <div class="sec">What this WebView supports</div>
    <table id="caps"></table>

    <div class="sec">Try each path</div>
    <button id="bImg">1 · Share the image (file)</button>
    <button id="bTxt">2 · Share text + link</button>
    <button id="bDl" class="alt">3 · Download the image</button>
    <button id="bCopy" class="alt">4 · Copy the link</button>

    <div class="sec">Or long-press this image → “Save Image”</div>
    <img id="card" alt="test card" />
    <p class="imgnote">Does a “Save Image / Add to Photos” menu appear on long-press?</p>

    <div class="sec">Log</div>
    <pre id="log"></pre>
    <button id="bLog" class="alt">📋 Copy the log (send this to Hendrik)</button>

    <script>
      var logEl = document.getElementById('log')
      var lines = []
      function log(msg) {
        var t = new Date().toISOString().slice(11, 19)
        lines.push('[' + t + '] ' + msg)
        logEl.textContent = lines.join('\n')
        logEl.scrollTop = logEl.scrollHeight
      }

      // --- build a real PNG (like the app's card) once, synchronously reusable ---
      var canvas = document.createElement('canvas')
      canvas.width = 540; canvas.height = 960
      var ctx = canvas.getContext('2d')
      ctx.fillStyle = '#fbf6ec'; ctx.fillRect(0, 0, 540, 960)
      ctx.fillStyle = '#ef2d06'; ctx.beginPath(); ctx.arc(60, 70, 12, 0, 7); ctx.fill()
      ctx.fillStyle = '#1c1813'; ctx.font = '900 34px sans-serif'; ctx.fillText('Stakes', 84, 82)
      ctx.font = '700 40px sans-serif'; ctx.fillText('share test 👀', 40, 300)
      ctx.fillStyle = '#0f7a44'; ctx.font = '900 90px sans-serif'; ctx.fillText('BANKED', 40, 430)
      var dataUrl = canvas.toDataURL('image/png')
      document.getElementById('card').src = dataUrl

      function dataUrlToFile(url, name) {
        var parts = url.split(','), bin = atob(parts[1]), n = bin.length, bytes = new Uint8Array(n)
        for (var i = 0; i < n; i++) bytes[i] = bin.charCodeAt(i)
        return new File([new Blob([bytes], { type: 'image/png' })], name, { type: 'image/png' })
      }

      var URL_ = 'https://stakes.surfstyk.com/?c=sharetest'
      var TXT = 'Banked the week ✅ testing the share sheet.'

      // --- capability probe ---
      function yn(v) { return v ? '<span class="ok">YES</span>' : '<span class="no">no</span>' }
      function row(k, v) { return '<tr><td>' + k + '</td><td>' + v + '</td></tr>' }
      ;(function () {
        var f = dataUrlToFile(dataUrl, 'stakes.png')
        var canShareFiles = false, canShareTxt = false
        try { canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [f] })) } catch (e) {}
        try { canShareTxt = !!(navigator.canShare && navigator.canShare({ text: TXT, url: URL_ })) } catch (e) {}
        var host = !!(window.nimiqPay || window.nimiq)
        document.getElementById('caps').innerHTML =
          row('inside Nimiq Pay', yn(host)) +
          row('secure context (https)', yn(window.isSecureContext)) +
          row('navigator.share', yn(!!navigator.share)) +
          row('navigator.canShare', yn(!!navigator.canShare)) +
          row('canShare({files}) — image', yn(canShareFiles)) +
          row('canShare({text,url})', yn(canShareTxt)) +
          row('clipboard.writeText', yn(!!(navigator.clipboard && navigator.clipboard.writeText))) +
          row('UA', '<span style="font-size:11px">' + navigator.userAgent + '</span>')
        log('probe: host=' + host + ' share=' + !!navigator.share + ' canShareFiles=' + canShareFiles +
            ' canShareTxt=' + canShareTxt + ' secure=' + window.isSecureContext)
      })()

      // --- path 1: share the image as a FILE (must stay in the gesture) ---
      document.getElementById('bImg').onclick = function () {
        if (!navigator.share) { log('1 image: navigator.share MISSING → cannot share'); return }
        var file = dataUrlToFile(dataUrl, 'stakes.png')
        if (navigator.canShare && !navigator.canShare({ files: [file] })) {
          log('1 image: canShare({files}) = FALSE → this WebView refuses image files'); return
        }
        log('1 image: calling navigator.share({files})…')
        navigator.share({ files: [file], text: TXT }).then(
          function () { log('1 image: ✅ SHARED OK (sheet completed)') },
          function (e) { log('1 image: ✗ ' + e.name + ' — ' + e.message) }
        )
      }

      // --- path 2: share text + link ---
      document.getElementById('bTxt').onclick = function () {
        if (!navigator.share) { log('2 text: navigator.share MISSING'); return }
        log('2 text: calling navigator.share({text,url})…')
        navigator.share({ text: TXT, url: URL_ }).then(
          function () { log('2 text: ✅ SHARED OK') },
          function (e) { log('2 text: ✗ ' + e.name + ' — ' + e.message) }
        )
      }

      // --- path 3: download via <a download> ---
      document.getElementById('bDl').onclick = function () {
        try {
          var a = document.createElement('a')
          a.href = dataUrl; a.download = 'stakes.png'
          document.body.appendChild(a); a.click(); document.body.removeChild(a)
          log('3 download: click dispatched → DID a file save, or did nothing/opened a viewer?')
        } catch (e) { log('3 download: ✗ ' + e.name + ' — ' + e.message) }
      }

      // --- path 4: copy link ---
      document.getElementById('bCopy').onclick = function () {
        if (!(navigator.clipboard && navigator.clipboard.writeText)) { log('4 copy: clipboard API MISSING'); return }
        navigator.clipboard.writeText(URL_).then(
          function () { log('4 copy: ✅ link copied to clipboard') },
          function (e) { log('4 copy: ✗ ' + e.name + ' — ' + e.message) }
        )
      }

      document.getElementById('bLog').onclick = function () {
        var text = lines.join('\n')
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function () { log('— log copied ✓ (paste it to Hendrik)') },
            function () { log('— copy failed; screenshot the log instead') }
          )
        } else { log('— no clipboard; screenshot the log instead') }
      }
    </script>
  </body>
</html>
