name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build
        # ⚠️ TEMP(filming) 2026-07-30 — shipping the DEV-TOOLS build (`npm run build`, NOT
        # build:public) so ?test (fast-clock) and ?recon work on the LIVE site for the demo
        # recording. Pre-launch beta, short window, reverted right after.
        # REVERT AFTER FILMING: `git revert` this commit → restores `npm run build:public`,
        # which strips ?recon/?test from the shipped bundle. See surfstyk-notes/DEPLOYMENT.md §9.
        run: npm run build
        env:
          # Public treasury address as a GitHub Actions VARIABLE (not a secret). When set,
          # the app uses the real custodial-NIM vault inside Nimiq Pay; when the variable is
          # absent this renders empty → mock vault. So this line is a no-op until the var is
          # added — adding it + redeploying is the whole "flip to real deposits" switch.
          VITE_TREASURY_NIM_ADDRESS: ${{ vars.VITE_TREASURY_NIM_ADDRESS }}

      # Deploy target lives in repo secrets so this public file advertises no infra.
      # Required secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
