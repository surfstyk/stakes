name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # Gate: nothing deploys unless the whole suite + both typechecks are green. server/*.ts is
  # not covered by the src typecheck (tsconfig only includes src/), so it gets its own pass.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck (app)
        run: npm run typecheck
      - name: Typecheck (server)
        run: npm run typecheck:server
      - name: Test
        run: npm test

  # Gate: the Playwright harness drives the real (mock) build headlessly — the golden path never
  # blanks, and no screen is a dead end or overflows the phone frame. Separate job so the browser
  # download doesn't slow the unit gate; deploy waits on both.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (flow + crawl)
        run: npm run test:e2e

  deploy:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - name: Build
        # build:public sets VITE_PUBLIC_BUILD=1 → the ?recon diagnostics and ?test
        # fast-clock are compiled out and tree-shaken from the shipped bundle. Use plain
        # `npm run build` only for dev/testnet deploys where those dev tools are wanted.
        run: npm run build:public
        env:
          # Public treasury address as a GitHub Actions VARIABLE (not a secret). When set,
          # the app uses the real custodial-NIM vault inside Nimiq Pay; when the variable is
          # absent this renders empty → mock vault. So this line is a no-op until the var is
          # added — adding it + redeploying is the whole "flip to real deposits" switch.
          VITE_TREASURY_NIM_ADDRESS: ${{ vars.VITE_TREASURY_NIM_ADDRESS }}
          # Published stamp address (GitHub Actions VARIABLE — a public NIM address, not a key).
          # REQUIRED for on-chain stamps: in a real-money build (treasury set) an unset stamp
          # address makes sendStamp() throw → both callers swallow it → check-ins never reach the
          # chain, silently killing "make some noise, on-chain". Inert until the var is set.
          # Optional VITE_STAMP_VALUE_LUNA overrides the 1-luna dust amount (defaults to 1).
          VITE_STAMP_ADDRESS: ${{ vars.VITE_STAMP_ADDRESS }}
          VITE_STAMP_VALUE_LUNA: ${{ vars.VITE_STAMP_VALUE_LUNA }}

      # Deploy target lives in repo secrets so this public file advertises no infra.
      # Required secrets: DEPLOY_SSH_KEY, DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH.
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy
        run: rsync -avz --delete -e "ssh -i ~/.ssh/deploy_key" dist/ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.DEPLOY_PATH }}"
